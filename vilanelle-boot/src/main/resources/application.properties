spring.application.name=vilanelle-boot

spring.datasource.url=jdbc:mysql://localhost:3306/vilanelledb
spring.datasource.username = root
spring.datasource.password = root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jackson.serialization.write-dates-as-timestamps=false

storage.base-path=uploads/documents
storage.pictures-path=uploads/pictures
storage.affiches-path=uploads/affiches

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB