<form class="upload-form" (ngSubmit)="submit()">
  <h2 class="title-section">Ajouter une photo</h2>

  <div class="form-group">
    <label for="albumName">Album *</label>
    <input id="albumName" type="text" [(ngModel)]="albumName" name="albumName" placeholder="Nom de l'album" required />
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="photoMonth">Mois *</label>
      <select id="photoMonth" [(ngModel)]="photoMonth" name="photoMonth" required>
        <option [ngValue]="null" disabled>Mois</option>
        @for (month of months; track $index) {
          <option [ngValue]="$index + 1">{{ month }}</option>
        }
      </select>
    </div>
    <div class="form-group">
      <label for="photoYear">Année *</label>
      <select id="photoYear" [(ngModel)]="photoYear" name="photoYear" required>
        <option [ngValue]="null" disabled>Année</option>
        @for (year of years; track year) {
          <option [ngValue]="year">{{ year }}</option>
        }
      </select>
    </div>
  </div>

  <div class="form-group">
    <label for="title">Titre</label>
    <input id="title" type="text" [(ngModel)]="title" name="title" placeholder="Titre de la photo (optionnel)" />
  </div>

  <div class="form-group">
    <label for="file">Fichier image *</label>
    <input id="file" type="file" accept="image/*" (change)="onFileSelected($event)" name="file" />
  </div>

  <div class="form-group checkbox-group">
    <label>
      <input type="checkbox" [(ngModel)]="visibleOnHome" name="visibleOnHome" />
      Afficher sur la page d'accueil
    </label>
  </div>

  @if (error) {
    <p class="error-msg">{{ error }}</p>
  }

  <button type="submit" [disabled]="!selectedFile || !albumName || !photoMonth || !photoYear || uploading" class="btn-submit">
    {{ uploading ? 'Upload en cours...' : 'Ajouter la photo' }}
  </button>
</form>
