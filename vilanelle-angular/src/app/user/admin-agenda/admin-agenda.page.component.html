<app-navadmin/>

<div class="allpage">
  <!-- SECTION TABLEAU -->
  <div class="container text-center mt-2 p-5 section2">
    <div class="content-box p-4">

      <h2 class="title-section">Gestion des évènements</h2>

      <table class="table table-hover mt-4">
        <thead class="table-light">
          <tr>
            <th>Ville</th>
            <th>Lieu</th>
            <th>CP</th>
            <th>Libellé</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let evenement of evenement$ | async; trackBy: trackEvenement">
            <td>{{ evenement.ville }}</td>
            <td>{{ evenement.lieu }}</td>
            <td>{{ evenement.cp }}</td>
            <td>{{ evenement.libelle }}</td>
            <td>
              {{ evenement.date | date:'dd/MM/yyyy HH:mm':'':'fr-FR' }}
            </td>
            <td>
              <button
                class="btn btn-sm btn-outline-primary me-2"
                (click)="editEvenement(evenement)"
              >
                Modifier
              </button>

              <button
                class="btn btn-sm btn-outline-danger"
                (click)="deleteEvenement(evenement)"
              >
                Supprimer
              </button>
            </td>
          </tr>
        </tbody>
      </table>

    </div>
  </div>

  <!-- SECTION FORMULAIRE -->
  <div class="container text-center mt-2 p-5 section1">
    <div class="content-box p-4">

      <h2 class="title-section">
        {{ editingEvenement ? 'Modifier un évènement' : 'Ajouter un évènement' }}
      </h2>

      <form
        [formGroup]="evenementForm"
        (ngSubmit)="ajouterModifierMap()"
        class="mt-4 mx-auto"
        style="max-width: 500px;"
      >

        <!-- Ville -->
        <div class="mb-3">
          <input
            type="text"
            class="form-control"
            placeholder="Ville"
            formControlName="ville"
          />
        </div>

        <!-- Lieu -->
        <div class="mb-3">
          <input
            type="text"
            class="form-control"
            placeholder="Lieu"
            formControlName="lieu"
          />
        </div>

        <!-- Code postal -->
        <div class="mb-3">
          <input
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            class="form-control no-spinner"
            placeholder="Code postal"
            formControlName="cp"
          />
        </div>

        <!-- Libellé -->
        <div class="mb-3">
          <input
            type="text"
            class="form-control"
            placeholder="Libellé"
            formControlName="libelle"
          />
        </div>

        <!-- Date -->
        <div class="mb-4">
          <input
            type="datetime-local"
            class="form-control"
            formControlName="date"
          />
        </div>

        <!-- Boutons -->
        <div class="mt-3">
          <button
            class="btn btn-danger px-4"
            type="submit"
            [disabled]="evenementForm.invalid"
          >
            {{ editingEvenement ? 'Modifier' : 'Ajouter' }}
          </button>

          <button
            *ngIf="editingEvenement"
            type="button"
            class="btn btn-secondary ms-3"
            (click)="evenementForm.reset(); editingEvenement = null"
          >
            Annuler
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
