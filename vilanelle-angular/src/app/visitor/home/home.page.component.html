<app-navbar/>

<div class="allpage">
  <div class="full-page">
    <div class="container text-center">
      <h1>CHOEUR MIXTE LA VILLANELLE</h1>

      @if (homePhotos.length > 0) {
        <section class="photo-gallery-section">
          <div class="mosaic-grid">
            @for (photo of homePhotos; track photo.id) {
              <div class="mosaic-item" (click)="openPhoto(photo)">
                <img [src]="photoService.getPhotoImageUrl(photo.id)" [alt]="photo.title" />
              </div>
            }
          </div>
        </section>
      }
    </div>
  </div>
</div>

@if (selectedPhoto) {
  <div class="lightbox" (click)="closePhoto()">
    <div class="lightbox-content" (click)="$event.stopPropagation()">
      <button class="close-btn" (click)="closePhoto()">×</button>
      <img [src]="photoService.getPhotoImageUrl(selectedPhoto.id)" [alt]="selectedPhoto.title" />
      @if (selectedPhoto.title) {
        <p class="text-section">{{ selectedPhoto.title }}</p>
      }
    </div>
  </div>
}
